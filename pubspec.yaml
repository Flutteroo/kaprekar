name: kaprekar
description: "Numerical Party Trick."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^0.13.3
  intl: ^0.19.0
  provider: ^5.0.0
  shared_preferences: ^2.2.2
  uuid: ^3.0.4
  xml: ^5.1.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  material_symbols_icons: ^4.2719.1
  package_info_plus: ^5.0.1
  share_plus: ^7.2.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.11.0

flutter:

  uses-material-design: true

  fonts:
    - family: 3270NerdFont
      fonts:
        - asset: fonts/3270NerdFontMono-Condensed.ttf

  assets:
    - assets/kaprekar.png

flutter_icons:
  android: false
  ios: true
  image_path: "logo.png"